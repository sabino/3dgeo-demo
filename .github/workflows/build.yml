name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ROM and regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build CI environment
        run: docker build --tag 3dgeo-ci --file ci/Dockerfile .
      - name: Build, test, and package
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          --volume "$PWD:/workspace" 3dgeo-ci
      - name: Upload ROM and matching source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: 3dgeo-demo
          path: build/ci/dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics and visual captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-diagnostics
          path: |
            build/ci/toolchain.txt
            build/ci/native-test.log
            build/ci/gallery.log
            build/ci/captures/
            build/ci/native-captures/
            build/ci/gallery/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Draft tagged release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: 3dgeo-demo
          path: release
      - name: Check downloaded files
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Create draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes
          release/3dgeo-demo.zip release/3dgeo-demo-source.tar.gz release/SHA256SUMS
